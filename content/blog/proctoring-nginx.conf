server {
    listen 80;
    server_name your_domain_or_ip;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com;  # Replace with your actual domain or public IP

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;  # Path to full chain cert (e.g. from certbot)
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;    # Path to matching private key

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        alias /var/www/html/;
        autoindex off;
    }
}